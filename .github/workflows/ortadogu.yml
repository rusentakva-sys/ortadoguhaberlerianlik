name: ortadogu-takip

on:
  schedule:
    - cron: "*/10 * * * *"   # komutlara bakar + anlık uyarı taraması
    - cron: "0 4 * * *"      # 04:00 UTC = 07:00 Türkiye saati, günlük gündem
  workflow_dispatch:
    inputs:
      mode:
        description: "run, digest, report, events, check veya alert"
        default: "check"

permissions:
  contents: write

concurrency:
  group: ortadogu-takip
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MAP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE_INPUT: ${{ github.event.inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            MODE="$MODE_INPUT"
          elif [ "$SCHEDULE" = "0 4 * * *" ]; then
            MODE="digest"
          else
            MODE="run"
          fi
          python monitor.py "$MODE"

      - name: Görülen haberleri kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen.json || true
          git add usage.json || true
          git add geocache.json || true
          git add docs/events.json || true
          git diff --cached --quiet || (git commit -m "seen güncelle" && git push)
