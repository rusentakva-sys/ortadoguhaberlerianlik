name: ortadogu-takip

on:
  schedule:
    - cron: "*/15 * * * *"   # anlık uyarı (yaklaşık 15 dk'da bir)
    - cron: "0 4 * * *"      # 04:00 UTC = 07:00 Türkiye saati, günlük özet
  workflow_dispatch:
    inputs:
      mode:
        description: "alert veya digest"
        default: "digest"

permissions:
  contents: write

concurrency:
  group: ortadogu-takip
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 4 * * *" ]; then
            MODE="digest"
          else
            MODE="alert"
          fi
          python monitor.py "$MODE"

      - name: Görülen haberleri kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen.json || true
          git diff --cached --quiet || (git commit -m "seen güncelle" && git push)
